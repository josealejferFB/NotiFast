<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>El Ciclo de la Dispersión Académica - Assets</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet" />
    
    <style>
        :root {
            --color-ruby: #BF092F;
            --color-aqua: #3B9797;
            --color-text: #1f2833;
            --color-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            gap: 60px;
        }

        /* 
           Canvas size set to 16:9 ratio (Standard presentation slide) 
           Perfect for screenshotting as a visual asset.
        */
        .presentation-canvas {
            position: relative;
            width: 1280px;
            height: 720px;
            background: #ffffff; /* Minimalist white background */
            /* Added a tiny border just so you can see where the slide boundaries are */
            border: 1px dashed #e0e0e0;
        }

        /* Chaotic Dashed Lines (SVG container) */
        .chaos-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .broken-link {
            position: absolute;
            color: var(--color-ruby);
            background: white;
            border-radius: 50%;
            padding: 2px;
            font-size: 38px;
            z-index: 2;
        }

        /* Nodes Container */
        .node {
            position: absolute;
            z-index: 5;
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 50%;
            border: 3px solid var(--color-aqua);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer ring with Half-Ruby / Half-Aqua */
        .node-icon-ring {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(var(--color-aqua) 0% 50%, var(--color-ruby) 50% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 7px;
            /* Creates a small white gap between the ring and the inner circle */
            box-shadow: inset 0 0 0 4px white; 
        }

        /* Inner circle containing the icon */
        .node-icon-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .node-icon-inner .material-symbols-rounded {
            font-size: 65px;
            color: #2c3e50;
        }

        /* Node Specific Positioning */
        #node-captura {
            top: 190px;
            left: 170px;
        }

        #node-calculo {
            bottom: 100px;
            left: 550px;
        }

        #node-plan {
            top: 190px;
            right: 220px;
        }

        /* Quote Box Styles - Re-added for independent use */
        .quote-card {
            position: relative;
            background: var(--color-ruby);
            color: white;
            width: 450px;
            padding: 30px 30px 25px 30px;
            border-radius: 15px;
            /* Just enough space to sit visually separate */
        }

        .quote-card p {
            position: relative;
            z-index: 2;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .quote-author {
            font-weight: 700;
            font-size: 1.05rem;
            opacity: 0.95;
            position: relative;
            z-index: 2;
        }

        .quote-mark {
            position: absolute;
            font-family: Georgia, serif;
            font-size: 4.5rem;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1;
        }
        .quote-mark.left {
            top: 15px;
            left: 15px;
        }
        .quote-mark.right {
            bottom: -20px;
            right: 20px;
        }

        .quote-chevron {
            position: absolute;
            top: -15px;
            right: 25px;
            width: 40px;
            height: 40px;
            background: #90001D;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

    </style>
</head>
<body>
    
    <!-- Graphic Canvas (Purely Visual) -->
    <div class="presentation-canvas">

        <svg class="chaos-lines" viewBox="0 0 1280 720">
            <path d="M 260,280 L 640,570 L 970,280 L 260,280" stroke="#BF092F" stroke-width="2.5" stroke-dasharray="10, 10" fill="none" />
            <path d="M 100,500 L 300,450 L 550,200 L 800,450 L 1100,600" stroke="#BF092F" stroke-width="2" stroke-dasharray="6, 12" fill="none" />
            <path d="M 50,200 L 400,650 L 700,100 L 1200,300" stroke="#BF092F" stroke-width="1.5" stroke-dasharray="15, 10" fill="none" />
            <path d="M 450,350 L 640,150 L 850,350 L 640,700" stroke="#BF092F" stroke-width="2" stroke-dasharray="8, 8" fill="none" />
            <path d="M 0,350 L 1280,350" stroke="#BF092F" stroke-width="1" stroke-dasharray="4, 15" fill="none" opacity="0.5" />
            
            <g stroke="#BF092F" stroke-width="2.5" stroke-linecap="round">
                <path d="M 400,300 L 380,280 M 400,300 L 420,280 M 400,300 L 390,320 M 400,300 L 410,315" />
                <path d="M 400,300 L 400,270 M 400,300 L 375,300" />
                <path d="M 780,220 L 760,200 M 780,220 L 800,200 M 780,220 L 770,240 M 780,220 L 790,235" />
                <path d="M 230,550 L 210,530 M 230,550 L 250,530 M 230,550 L 220,570 M 230,550 L 240,565" />
                <path d="M 230,550 L 230,520 M 230,550 L 200,550" />
            </g>
        </svg>

        <span class="material-symbols-rounded broken-link" style="top: 360px; left: 520px; transform: rotate(15deg);">link_off</span>
        <span class="material-symbols-rounded broken-link" style="top: 180px; left: 630px; transform: rotate(-25deg);">link_off</span>
        <span class="material-symbols-rounded broken-link" style="top: 480px; left: 820px; transform: rotate(45deg);">link_off</span>

        <!-- NODE 1 -->
        <div class="node" id="node-captura">
            <div class="node-icon-ring">
                <div class="node-icon-inner">
                    <span class="material-symbols-rounded">photo_camera</span>
                </div>
            </div>
        </div>

        <!-- NODE 2 -->
        <div class="node" id="node-plan">
            <div class="node-icon-ring" style="background: conic-gradient(var(--color-ruby) 0% 50%, var(--color-aqua) 50% 100%);">
                <div class="node-icon-inner">
                    <span class="material-symbols-rounded">calendar_month</span>
                </div>
            </div>
        </div>

        <!-- NODE 3 -->
        <div class="node" id="node-calculo">
            <div class="node-icon-ring" style="background: conic-gradient(var(--color-aqua) 0% 50%, var(--color-ruby) 50% 100%);">
                <div class="node-icon-inner">
                    <span class="material-symbols-rounded">calculate</span>
                </div>
            </div>
        </div>
        
    </div> <!-- end presentation-canvas -->

    <!-- Separated Text Quote Box -->
    <div class="quote-card">
        <div class="quote-chevron">
            <span class="material-symbols-rounded">chevron_right</span>
        </div>
        <span class="quote-mark left">“</span>
        <span class="quote-mark right">”</span>
        <p>La ausencia de un núcleo organizativo digital impide que el estudiante establezca una trazabilidad clara entre el material de estudio y las metas evaluativas a corto plazo.</p>
        <div class="quote-author">(López, 2024)</div>
    </div>

</body>
</html>
