<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Objetivo del Proyecto - Convergencia</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet" />
    
    <style>
        :root {
            --color-ruby: #BF092F;
            --color-aqua: #3B9797;
            --color-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .presentation-canvas {
            position: relative;
            width: 1280px;
            height: 720px;
            background: #ffffff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* SVG Background / Gravity Well */
        .gravity-well {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(191,9,47,0.15) 0%, rgba(59,151,151,0.05) 40%, rgba(255,255,255,0) 70%);
            z-index: 2;
            border-radius: 50%;
        }

        /* Explosion burst of organized NotiFast icons */
        .explosion-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3; /* Behind the phone (which is 10) but above the gravity well */
            opacity: 0.9;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            /* A subtle float animation */
            animation: float 6s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(var(--sc)); }
            100% { transform: translate(calc(var(--tx) + 15px), calc(var(--ty) - 15px)) rotate(calc(var(--rot) + 10deg)) scale(calc(var(--sc) + 0.1)); }
        }

        /* Phone Mockup */
        .phone-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .phone-mockup {
            width: 250px;
            height: 520px;
            background: #0b0c10;
            border-radius: 40px;
            border: 10px solid #2a2a35;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Give it a 3D pop out effect */
            transform: scale(1.05);
        }

        .phone-notch {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 25px;
            background: #2a2a35;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 11;
        }

        .splash-screen {
            width: 100%;
            height: 100%;
            /* Real NotiFast background */
            background: linear-gradient(180deg, #1B262C 0%, #223038 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Faint glow behind logo in splash */
        .splash-screen::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(191,9,47,0.3) 0%, rgba(59,151,151,0.2) 50%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(20px);
        }

        /* Real logo image */
        .splash-logo {
            width: 120px;
            height: auto;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        /* Peripheral Problem Icons */
        .asset-icon {
            position: absolute;
            width: 95px;
            height: 95px;
            background: #ffffff;
            border-radius: 24px;
            border: 3px solid var(--color-aqua);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .asset-icon .material-symbols-rounded {
            font-size: 48px;
            color: #1f2833;
        }

        /* Positioning the 4 converging points */
        #icon-captura { top: 110px; left: 240px; }
        #icon-plan    { top: 110px; right: 240px; }
        #icon-calculo { bottom: 110px; left: 240px; }
        #icon-apuntes { bottom: 110px; right: 240px; }

    </style>
</head>
<body>
    <div class="presentation-canvas">

        <div class="center-glow"></div>

        <!-- Explosion of positive study icons from behind the phone -->
        <span class="material-symbols-rounded explosion-icon" style="--tx: -280px; --ty: -180px; --rot: -15deg; --sc: 1.2; color: var(--color-ruby);">menu_book</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: 250px; --ty: -220px; --rot: 25deg; --sc: 0.9; color: var(--color-aqua);">school</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: -350px; --ty: 0px; --rot: -45deg; --sc: 1.5; color: var(--color-aqua);">science</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: 300px; --ty: 40px; --rot: 10deg; --sc: 1.1; color: var(--color-ruby);">lightbulb</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: -260px; --ty: 200px; --rot: 35deg; --sc: 1.3; color: var(--color-ruby);">emoji_events</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: 220px; --ty: 220px; --rot: -20deg; --sc: 1.4; color: var(--color-aqua);">draw</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: -120px; --ty: -320px; --rot: 5deg; --sc: 1.1; color: var(--color-aqua);">translate</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: 100px; --ty: 280px; --rot: -30deg; --sc: 1.2; color: var(--color-ruby);">psychology</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: -380px; --ty: -100px; --rot: 60deg; --sc: 0.8; color: var(--color-ruby);">biotech</span>
        <span class="material-symbols-rounded explosion-icon" style="--tx: 350px; --ty: -120px; --rot: -60deg; --sc: 1.3; color: var(--color-ruby);">architecture</span>

        <!-- Gravity Well and Arrows SVG -->
        <svg class="gravity-well" viewBox="0 0 1280 720">
            <!-- Concentric ripples -->
            <g stroke="#3B9797" fill="none" stroke-width="1.5">
                <ellipse cx="640" cy="360" rx="550" ry="280" opacity="0.15" stroke-width="1" />
                <ellipse cx="640" cy="360" rx="450" ry="230" opacity="0.25" />
                <ellipse cx="640" cy="360" rx="350" ry="180" opacity="0.4" stroke="#BF092F" />
                <ellipse cx="640" cy="360" rx="250" ry="130" opacity="0.6" stroke="#BF092F" stroke-width="2" />
                <ellipse cx="640" cy="360" rx="150" ry="80" opacity="0.8" stroke="#BF092F" stroke-width="3" />
            </g>

            <defs>
                <linearGradient id="gradArrowL" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3B9797" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#BF092F" />
                </linearGradient>
                <linearGradient id="gradArrowR" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3B9797" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#BF092F" />
                </linearGradient>
                
                <marker id="arrowHeadL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#BF092F" />
                </marker>
                <marker id="arrowHeadR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#BF092F" />
                </marker>
            </defs>

            <!-- Converging thick arrows from the icons to the phone -->
            <path d="M 330,170 Q 450,200 480,260" stroke="url(#gradArrowL)" stroke-width="14" fill="none" stroke-linecap="round" marker-end="url(#arrowHeadL)" />
            <path d="M 950,170 Q 830,200 800,260" stroke="url(#gradArrowR)" stroke-width="14" fill="none" stroke-linecap="round" marker-end="url(#arrowHeadR)" />
            <path d="M 330,550 Q 450,520 480,460" stroke="url(#gradArrowL)" stroke-width="14" fill="none" stroke-linecap="round" marker-end="url(#arrowHeadL)" />
            <path d="M 950,550 Q 830,520 800,460" stroke="url(#gradArrowR)" stroke-width="14" fill="none" stroke-linecap="round" marker-end="url(#arrowHeadR)" />
        </svg>

        <!-- Peripheral Problem Icons -->
        <div class="asset-icon" id="icon-captura">
            <span class="material-symbols-rounded">photo_camera</span>
        </div>
        
        <div class="asset-icon" id="icon-plan">
            <span class="material-symbols-rounded">calendar_month</span>
        </div>

        <div class="asset-icon" id="icon-calculo">
            <span class="material-symbols-rounded">calculate</span>
        </div>

        <div class="asset-icon" id="icon-apuntes">
            <span class="material-symbols-rounded">menu_book</span>
        </div>

        <!-- Central Phone Mockup -->
        <div class="phone-wrapper">
            <div class="phone-mockup">
                <div class="phone-notch"></div>
                <div class="splash-screen">
                    <img src="../app/src/main/res/drawable/logo.png" alt="NotiFast Logo" class="splash-logo">
                </div>
            </div>
        </div>

    </div>
</body>
</html>
