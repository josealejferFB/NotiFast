name: NotiFast CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-tests:
    name: Landing Page & Documentation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Landing Tests
        run: |
          python3 -m unittest discover -s tests -v

  deploy-landing:
    name: Deploy & Verify Landing on Cloudflare Pages
    needs: [python-tests]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare Secrets Are Configured
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions. El deploy a Cloudflare Pages no puede ejecutarse."
            exit 1
          fi
          echo "Secrets de Cloudflare disponibles."

      - name: Deploy via Wrangler to Cloudflare Pages develop branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing --project-name=notifast --branch=develop --commit-dirty=true

      - name: Verify Live Cloudflare Pages Deployment (https://notifast.pages.dev/)
        run: |
          echo "Verifying live deployment at https://notifast.pages.dev/ ..."
          for i in 1 2 3 4 5 6 7 8; do
            HTML=$(curl -fsSL "https://notifast.pages.dev/" || true)
            PRIVACY=$(curl -fsSL "https://notifast.pages.dev/privacy" || true)
            if echo "$HTML" | grep -q 'id="temas"' && echo "$HTML" | grep -q 'id="notificaciones"' && echo "$HTML" | grep -q 'hero-logo-stage' && echo "$PRIVACY" | grep -q 'Políticas de Privacidad'; then
              echo "Cloudflare Pages (https://notifast.pages.dev/) is live and serving the latest NotiFast landing + privacy policy!"
              exit 0
            fi
            echo "Waiting for Cloudflare Pages edge propagation (attempt $i/8)..."
            sleep 6
          done
          echo "Verification failed: Expected sections not found on https://notifast.pages.dev/"
          exit 1

  android-tests:
    name: Android Unit Tests & Static Verification
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure google-services.json (Secret or CI Fallback)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "notifast-ci-stub",
              "storage_bucket": "notifast-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.notifast.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForContinuousIntegration00000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  android-build:
    name: Assemble APKs (Debug & Release)
    needs: [android-tests, python-tests]
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure google-services.json (Secret or CI Fallback)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "notifast-ci-stub",
              "storage_bucket": "notifast-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.notifast.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForContinuousIntegration00000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: notifast-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
