<!DOCTYPE html>
<!-- impeccable-disable overused-font -- Plus Jakarta Sans is the canonical NotiFast Android app typeface defined in DESIGN.md -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página no encontrada — NotiFast Cuaderno Académico Inteligente.">
  <meta name="theme-color" content="#9E1B32">
  <title>404 — Página no encontrada | NotiFast</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }
    .error-card {
      background: var(--bg-surface, #FFFFFF);
      border: 1px solid var(--border-hairline, #E5DFD7);
      border-radius: 28px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(24, 26, 31, 0.08);
    }
    .error-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 20px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 4rem;
      font-weight: 800;
      color: var(--brand-primary, #9E1B32);
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary, #181A1F);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-secondary, #4B5563);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brand-primary, #9E1B32);
      color: #FFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .error-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(24, 26, 31, 0.14);
    }
  </style>
</head>
<body style="background-color: var(--bg-canvas, #FAF9F6); margin: 0; font-family: var(--font-sans);">
  <div class="error-container">
    <div class="error-card">
      <img src="assets/logo.png" alt="NotiFast Logo" class="error-logo">
      <div class="error-code">404</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-desc">La página o recurso que buscas no existe o ha sido movida. Regresa al inicio para continuar explorando NotiFast.</p>
      <a href="index.html" class="error-btn">
        <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Volver al inicio</span>
      </a>
    </div>
  </div>
</body>
</html>
